<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight Archive // Notebook OS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 40px 10px;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .site-wrapper {
      max-width: 980px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .top-banner {
      background: #e4e4e9;
      border: 2px solid #111111;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      justify-content: space-between; /* Sposta il titolo tutto a sinistra dopo la rimozione del box destro */
      align-items: center;
      background-image: radial-gradient(#888888 0.75px, transparent 0.75px);
      background-size: 8px 8px;
    }

    .banner-box {
      background: #ffffff;
      border: 2px solid #111111;
      padding: 10px 24px;
      border-radius: 999px;
      box-shadow: 3px 3px 0px #111111;
    }

    .banner-box h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }

    .grid-container {
      display: grid;
      grid-template-columns: 240px 1fr 220px;
      gap: 14px;
      align-items: stretch;
      padding-bottom: 20px;
    }

    .col-center, .col-right {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .floating-avatar {
      position: absolute;
      top: -100px;
      right: -5px;
      width: 170px; /* Avatar ancora più piccolo */
      height: auto;
      z-index: 100;
      pointer-events: none;
      filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.15));
    }

    .box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
      margin-bottom: 14px;
    }
    .box-header {
      background: #f0f0f3;
      border-bottom: 2px solid #111111;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .box-body { padding: 14px; }

    .box-dark {
      background: #111111;
      color: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
      margin-bottom: 14px;
    }
    .box-dark .box-header {
      background: #222222;
      color: #ffffff;
      border-bottom: 2px solid #444444;
    }

    .receipt-box {
      background: #ffffff;
      border: 2px solid #111111;
      padding: 18px 14px;
      box-shadow: 4px 4px 0px #111111;
      margin-bottom: 14px;
      transform: rotate(-2deg);
      transition: transform 0.2s ease;
    }
    .receipt-box:hover { transform: rotate(0deg) scale(1.01); }
    .receipt-title { text-align: center; font-weight: 800; font-size: 0.85rem; }
    .receipt-dash { border: none; border-top: 2px dashed #111; margin: 10px 0; }

    .receipt-menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .receipt-menu-list a {
      color: #111;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.78rem;
      display: block;
      padding: 8px 10px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .receipt-menu-list a.active, .receipt-menu-list a:hover {
      background: #111111;
      color: #ffffff;
    }

    .receipt-barcode {
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    /* CALENDARIO FIXATO E BEN VISIBILE */
    .calendar-graphic-dark { 
      width: 36px; height: 36px; border: 2px solid #fff; border-radius: 6px; background: #222; margin: 0 auto 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 2px 2px 0px #fff;
    }
    .calendar-graphic-top-dark { background: #fff; height: 10px; width: 100%; }
    .calendar-graphic-body-dark { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 800; color: #fff; }

    .mini-calendar-dark { width: 100%; font-size: 0.68rem; text-align: center; border-collapse: collapse; }
    .mini-calendar-dark th, .mini-calendar-dark td { padding: 4px 2px; border: none; color: #ffffff; }
    .mini-calendar-dark th { background: #333333; color: #ffffff; font-size: 0.6rem; font-weight: 800; border-radius: 4px; }
    .mini-calendar-dark td.today-dark { background: #ffffff; color: #111111; font-weight: 800; border-radius: 4px; }

    .pixel-clock-box-dark {
      background: #111;
      border: 2px solid #111;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      box-shadow: 3px 3px 0px #111;
      margin-bottom: 10px;
    }
    .pixel-clock-time-dark {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .ipod-player { background: #fff; border: 2px solid #111; border-radius: 20px; padding: 12px; text-align: center; }
    .ipod-screen { background: #111; color: #fff; border-radius: 10px; padding: 8px; font-size: 0.7rem; font-weight: 700; margin-bottom: 10px; min-height: 45px; display: flex; flex-direction: column; justify-content: center; }
    .ipod-controls { display: flex; justify-content: center; gap: 8px; align-items: center; }
    .ipod-btn-ctrl { background: #f0f0f3; border: 2px solid #111; border-radius: 50%; width: 28px; height: 28px; font-size: 0.7rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0px #111; }
    .ipod-btn-ctrl:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #111; }

    .nav-box-btn {
      width: 100%;
      background: #ffffff;
      border: 2px solid #111;
      border-radius: 16px;
      padding: 10px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111;
      text-align: center;
      margin-bottom: 10px;
      transition: transform 0.1s ease;
      text-decoration: none;
      color: #111;
      display: block;
    }
    .nav-box-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #111; }
    .nav-box-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px #111; }

    .nav-box-btn-dark {
      width: 100%;
      background: #111111;
      color: #ffffff;
      border: 2px solid #111;
      border-radius: 16px;
      padding: 10px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111;
      text-align: center;
      margin-bottom: 10px;
      transition: transform 0.1s ease;
      text-decoration: none;
      display: block;
    }
    .nav-box-btn-dark:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #333; }
    .nav-box-btn-dark:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px #111; }

    .site-footer { border-top: 2px solid #111; padding-top: 12px; text-align: center; font-weight: 700; font-size: 0.72rem; color: #555; }

    .fullscreen-page { display: none; max-width: 960px; width: 100%; flex-direction: column; gap: 16px; }
    .fullscreen-page.active { display: flex; }

    .fullscreen-header {
      background: #ffffff;
      border: 3px solid #111;
      border-radius: 20px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #111;
    }

    .fullscreen-header h2 { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.3px; }

    .back-btn {
      background: #111111;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px #555;
    }
    .back-btn:hover { background: #333; }

    .cards-grid-scroll {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 10px;
      justify-items: center;
    }

    .buttons-wall-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding: 20px;
      background: #fff;
      border: 3px solid #111;
      border-radius: 20px;
      box-shadow: 4px 4px 0px #111;
    }
    .buttons-wall-grid img { width: 88px; height: 31px; border: 1px solid #111; image-rendering: pixelated; }

    .pure-card-img {
      max-width: 100%;
      width: auto;
      height: auto;
      display: block;
      filter: drop-shadow(4px 4px 0px #111);
      transition: transform 0.15s ease;
    }
    .pure-card-img:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <!-- ==========================================================
       VISTA HOME
       ========================================================== -->
  <div id="home-view" class="site-wrapper">

    <header class="top-banner">
      <div class="banner-box">
        <h1>MOONLIGHT ARCHIVE</h1>
      </div>
      <!-- SCRITTA CANCELLATA QUI -->
    </header>

    <div class="grid-container">

      <!-- COLONNA SINISTRA -->
      <aside class="col-left">
        <div class="receipt-box">
          <div class="receipt-title">.☘︎ ݁˖ MENU ☰ ❞</div>
          <hr class="receipt-dash">
          <ul class="receipt-menu-list">
            <li><a class="active">˙ᵕ˙ HOME</a></li>
            <li><a onclick="openPage('blog-page')">LOGS &amp; BLOG ✐ᝰ</a></li>
